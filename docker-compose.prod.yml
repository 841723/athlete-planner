services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "13799:4000"
    volumes:
      # Base de datos SQLite (persiste en el host, fuera del repo)
      - ./data:/app/data
      # Garmin OAuth tokens (persisten fuera del repo)
      - garmin_tokens:/root/.garminconnect
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  garmin_tokens:
